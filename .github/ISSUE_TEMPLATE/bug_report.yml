name: Bug report
description: Report an incorrect instruction, script failure, or documentation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provider, region, OS, GPU, driver, and tool version.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
