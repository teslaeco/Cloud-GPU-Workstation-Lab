[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-gpu-workstation-lab"
version = "0.1.0"
description = "Guides and tools for on-demand GPU workstations and compute clusters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sebastian Laskowski" }]
keywords = ["cloud-gpu", "game-development", "artificial-intelligence", "unreal-engine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/teslaeco/Cloud-GPU-Workstation-Lab"
Documentation = "https://github.com/teslaeco/Cloud-GPU-Workstation-Lab/tree/main/docs"
Issues = "https://github.com/teslaeco/Cloud-GPU-Workstation-Lab/issues"
Source = "https://github.com/teslaeco/Cloud-GPU-Workstation-Lab"

[project.scripts]
cloud-gpu-cost = "tools.cost_estimator:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
